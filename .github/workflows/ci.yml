name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  data:
    name: JSON 스키마 검증 + hook 자체 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate_data.py --strict
      - run: python3 tools/hooks/boundary.py --self-test
      - run: python3 tools/hooks/test_check_commit.py

  godot-tests:
    name: Godot 헤드리스 테스트
    runs-on: ubuntu-latest
    needs: data
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Godot 설치
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: 테스트
        env:
          SE_REQUIRE_GODOT: "1"
          GODOT_BIN: godot
        run: tools/run_tests.sh
