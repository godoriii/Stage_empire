name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  data:
    name: JSON 스키마 검증 + hook 자체 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # jsonschema 가 없으면 validate_data 의 내장 부분집합 검증기가 maxItems·maxLength·minProperties·propertyNames 를 무시한다(SE-031 qa 지적)
      - run: python3 -m pip install --quiet "jsonschema>=4.17"
      - run: python3 tools/validate_data.py --strict
      - run: python3 tools/hooks/boundary.py --self-test
      - run: python3 tools/hooks/test_check_commit.py
      - run: python3 -I tools/assets/test_lint_gltf.py
      - run: python3 -I tools/assets/test_make_test_furniture.py

  godot-tests:
    name: Godot 헤드리스 테스트
    runs-on: ubuntu-latest
    needs: data
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Godot 설치
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: 테스트
        env:
          SE_REQUIRE_GODOT: "1"
          GODOT_BIN: godot
        run: tools/run_tests.sh
      - name: 테스트용 가구 커밋본 = 생성기 재생성 비교 (.glb·META·lint 바이트, preview.png 픽셀 — SE-051·SE-059, LFS 필요)
        run: |
          set -eu
          python3 -I tools/assets/make_test_furniture.py --out "$RUNNER_TEMP/tf" --lint --preview
          python3 -I tools/assets/compare_test_furniture.py "$RUNNER_TEMP/tf" project/assets/review-queue

  replay-30day:
    name: 30일 리플레이 (SE036_LONG=1, 티어 해금 회귀)
    runs-on: ubuntu-latest
    needs: data
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Godot 설치
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: 30일 리플레이 (15일차 저장 → 로드 → 30일, SE-036 AC2·AC3, SE-057 AC5)
        env:
          SE_REQUIRE_GODOT: "1"
          GODOT_BIN: godot
          SE036_LONG: "1"
        run: tools/run_tests.sh project/tests/sim/replay

  screenshots:
    name: Xvfb 스크린샷 재캡처 + 셰이더 컴파일 확인 (SE-020)
    runs-on: ubuntu-latest
    needs: data
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Xvfb·Mesa(llvmpipe)·한글 폰트 설치
        # fonts-wqy-zenhei: 로컬 캡처와 같은 한글 폴백 폰트. 없으면 HUD 한글이 □ 로 그려져 기준 PNG 와 HUD 영역(bbox 28,16,593,198)이 달라진다(SE-025 진단).
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri fonts-wqy-zenhei
      - name: Godot 설치
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: 프로젝트 임포트
        run: godot --headless --path project --import
      - name: 9장 재캡처 (opengl3 = gl_compatibility, 셰이더 컴파일 오류가 있으면 여기서 실패)
        env:
          GODOT_BIN: godot
        run: project/tests/view/screenshots/recapture.sh "$RUNNER_TEMP/shots"
      - name: 기준 PNG 와 픽셀 차 (strict — 2026-10-09 전환, 연속 0 3회 확인 후)
        env:
          # 3회 연속 diff_pixels=0 이 확인되면 이 값을 "--strict" 로 바꾼다(1줄).
          STRICT_FLAG: "--strict"
        run: |
          set -u +e
          base=project/tests/view/screenshots
          rc_all=0
          for pair in SE-002/grid_yaw45_zoom2 SE-004/a_yaw45_zoom2 SE-004/b_yaw45_zoom2 SE-004/c_yaw45_zoom2 SE-004/b_yaw45_zoom0 SE-037/build_baseline_yaw45_zoom2 SE-038/crowd150_show_yaw45_zoom2 SE-039/hud_day_yaw45_zoom2 SE-039/report_close; do
            name="${pair#*/}"
            echo "== $name"
            # shellcheck disable=SC2086
            godot --headless --path project -s res://tests/view/screenshots/compare_png.gd -- \
              "$GITHUB_WORKSPACE/$base/$pair.png" "$RUNNER_TEMP/shots/$name.png" $STRICT_FLAG \
              | tee "$RUNNER_TEMP/shots/$name.diff.txt"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then rc_all=$rc; fi
          done
          exit $rc_all
      - name: 캡처·diff 로그 업로드 (러너 vs 로컬 차이 진단용 — 항상)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn
          overwrite: true
